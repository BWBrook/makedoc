name: manuscript-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: manuscript-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            ripgrep \
            python3-yaml

      - name: Print tool versions
        run: |
          pandoc --version | head -n 2
          xelatex --version | head -n 2
          python3 --version
          rg --version | head -n 1

      - name: Run full check pipeline
        run: make check

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-build-artifacts
          path: dist/
          if-no-files-found: ignore
