name: ci

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Pandoc and TeX
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: texlive-xetex texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
          version: v2-deps-1
          execute_install_scripts: true

      - name: Install Pandoc 3
        run: |
          curl -fsSL -o pandoc.deb https://github.com/jgm/pandoc/releases/download/3.6.4/pandoc-3.6.4-1-amd64.deb
          sudo dpkg -i pandoc.deb

      - uses: astral-sh/setup-uv@v5

      - name: Environment check
        run: uv run makedoc doctor

      - name: Tests
        run: uv run pytest -q

      - name: Build the fixture
        run: uv run makedoc build -c testbed/settings/build.yaml --all --strict

      - name: Upload fixture outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-outputs
          path: testbed/build/
          if-no-files-found: ignore
