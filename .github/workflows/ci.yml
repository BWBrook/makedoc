name: manuscript-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: manuscript-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install guard dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: ripgrep python3-yaml
          version: guard-deps-v1
          execute_install_scripts: true

      - name: Print tool versions
        run: |
          python3 --version
          rg --version | head -n 1

      - name: Validate build config
        run: |
          make validate-config

      - name: Run Python unit tests
        run: |
          make python-tests

      - name: Run manuscript and fixture guards
        run: |
          make lint-manuscript
          make refs-audit
          make fixture-lint
          make fixture-refs-audit
          make check-fixture-guards

  build-main:
    needs: guard-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: pandoc texlive-xetex texlive-latex-extra ripgrep python3-yaml
          version: build-main-deps-v1
          execute_install_scripts: true

      - name: Ensure build dependencies are present
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            ripgrep \
            python3-yaml

      - name: Build main manuscript outputs
        run: |
          make check-tools
          make test-output-routing
          make all

      - name: Summarize main artifacts
        run: |
          ls -lh dist/testbed/manuscript.pdf dist/testbed/manuscript.docx dist/testbed/manuscript_build_manifest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Collect main diagnostics on failure
        if: failure()
        run: |
          make diagnose

      - name: Upload main diagnostics (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-main-diagnostics
          path: dist/diagnostics/**/*
          if-no-files-found: ignore

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-main-artifacts
          path: |
            dist/testbed/manuscript.pdf
            dist/testbed/manuscript.docx
            dist/testbed/manuscript_build_manifest.json
          if-no-files-found: ignore

  build-fixture:
    needs: guard-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: pandoc texlive-xetex texlive-latex-extra ripgrep python3-yaml poppler-utils
          version: build-fixture-deps-v2
          execute_install_scripts: true

      - name: Ensure build dependencies are present
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            ripgrep \
            python3-yaml \
            poppler-utils

      - name: Build fixture outputs
        run: |
          make check-tools
          make fixture-all
          make fixture-contract-check

      - name: Summarize fixture artifacts
        run: |
          ls -lh dist/fixture/fixture_manuscript.pdf dist/fixture/fixture_manuscript.docx dist/fixture/fixture_manuscript_build_manifest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Collect fixture diagnostics on failure
        if: failure()
        run: |
          make fixture-diagnose

      - name: Upload fixture diagnostics (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-fixture-diagnostics
          path: dist/diagnostics/**/*
          if-no-files-found: ignore

      - name: Upload fixture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-fixture-artifacts
          path: |
            dist/fixture/fixture_manuscript.pdf
            dist/fixture/fixture_manuscript.docx
            dist/fixture/fixture_manuscript_build_manifest.json
          if-no-files-found: ignore
