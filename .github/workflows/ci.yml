name: ci

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Installed directly: a restored package cache skips the post-install steps that
      # register the Latin Modern fonts, and xelatex then cannot load them.
      - name: Install TeX and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended lmodern fonts-lmodern poppler-utils

      - name: Install Pandoc 3
        run: |
          curl -fsSL -o pandoc.deb https://github.com/jgm/pandoc/releases/download/3.6.4/pandoc-3.6.4-1-amd64.deb
          sudo dpkg -i pandoc.deb

      - uses: astral-sh/setup-uv@v5

      - name: Environment check
        run: uv run makedoc doctor

      - name: Tests
        run: uv run pytest -q

      - name: Build the fixture
        run: uv run makedoc build -c testbed/settings/build.yaml --all --strict

      - name: Upload fixture outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-outputs
          path: testbed/build/
          if-no-files-found: ignore
