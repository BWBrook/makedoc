[project]
name = "makedoc"
version = "2.0.1"
description = "Build journal-ready PDF and DOCX manuscripts from Markdown, a bibliography and a YAML profile."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Barry W. Brook" }]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
makedoc = "makedoc.cli:main"

[project.urls]
Repository = "https://github.com/BWBrook/makedoc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/makedoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
