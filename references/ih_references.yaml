- id: valencia2020SynchronyMattersMore
  abstract: |-
    Significance
                The stability of ecological communities under ongoing climate and land-use change is fundamental to the sustainable management of natural resources through its effect on critical ecosystem services. Biodiversity is hypothesized to enhance stability through compensatory effects (decreased synchrony between species). However, the relative importance and interplay between different biotic and abiotic drivers of stability remain controversial. By analyzing long-term data from natural and seminatural ecosystems across the globe, we found that the degree of synchrony among dominant species was the main driver of stability, rather than species richness per se. These biotic effects overrode environmental drivers, which influenced the stability of communities by modulating the effects of richness and synchrony.
              , 
                The stability of ecological communities is critical for the stable provisioning of ecosystem services, such as food and forage production, carbon sequestration, and soil fertility. Greater biodiversity is expected to enhance stability across years by decreasing synchrony among species, but the drivers of stability in nature remain poorly resolved. Our analysis of time series from 79 datasets across the world showed that stability was associated more strongly with the degree of synchrony among dominant species than with species richness. The relatively weak influence of species richness is consistent with theory predicting that the effect of richness on stability weakens when synchrony is higher than expected under random fluctuations, which was the case in most communities. Land management, nutrient addition, and climate change treatments had relatively weak and varying effects on stability, modifying how species richness, synchrony, and stability interact. Our results demonstrate the prevalence of biotic drivers on ecosystem stability, with the potential for environmental drivers to alter the intricate relationship among richness, synchrony, and stability.
