default_profile: default

profiles:
  default:
    description: Primary active manuscript profile (currently backed by synthetic testbed inputs).
    manuscript_sources:
      - testbed/manuscript/text/fixture_main.md
      - testbed/manuscript/text/fixture_figures.md
    author_metadata: testbed/manuscript/authors.yaml
    bibliography: testbed/references/fixture_refs.yaml
    csl: testbed/csl/fixture_style.csl
    journal: Oikos
    csl_search_dirs:
      - testbed/csl
      - csl
    output_dir: dist
    output_stem: manuscript
    page_numbers: lower_right
    line_spacing: 1.5
    line_numbering: continuous
    figures:
      placement: captions_page
      caption_position: top
      placeholder_id: figures
    margins:
      unit: cm
      paper_size: a4
      top: 2.0
      bottom: 2.0
      left: 2.5
      right: 2.5
    golden_contract: testbed/expected/golden_contract.yaml
