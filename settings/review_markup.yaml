default_profile: review_markup

profiles:
  review_markup:
    description: Experimental review-markup rendering probe.
    manuscript_sources:
      - ../testbed/manuscript/text/review_markup_probe.md
    lint_sources:
      - ../testbed/manuscript/text/review_markup_probe.md
    bibliography: ../testbed/references/fixture_refs.yaml
    csl: ../testbed/csl/fixture_style.csl
    journal: Oikos
    csl_search_dirs:
      - ../testbed/csl
    output_dir: dist/review-markup
    output_stem: review_markup_probe
    page_numbers: none
    line_spacing: single
    line_numbering: none
    references_new_page: false
    review_markup:
      enabled: true
    figures:
      placement: pages
      caption_position: top
      placeholder_id: figures
    margins:
      unit: cm
      paper_size: a4
      top: 2.0
      bottom: 2.0
      left: 2.5
      right: 2.5
